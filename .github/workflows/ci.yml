name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/oss-upload-api"
      - "codex/oss-direct-upload-react"
      - "codex/production-release"
      - "codex/session-hardening"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: feedsystem_upload_test
          MYSQL_USER: upload_test
          MYSQL_PASSWORD: upload-test-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Install media verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test
        env:
          OSS_TEST_MYSQL_DSN: upload_test:upload-test-password@tcp(127.0.0.1:${{ job.services.mysql.ports[3306] }})/feedsystem_upload_test?parseTime=true
        run: go test -race -count=1 ./...

      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Build API and worker images
        working-directory: .
        run: |
          docker build --build-arg GOPROXY=https://proxy.golang.org,direct --build-arg GOSUMDB=sum.golang.org -f backend/Dockerfile --target api -t feedsystem-api:ci .
          docker build --build-arg GOPROXY=https://proxy.golang.org,direct --build-arg GOSUMDB=sum.golang.org -f backend/Dockerfile --target worker -t feedsystem-worker:ci .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser regression
        run: npm run test:e2e -- --workers=2

      - name: Production container smoke
        working-directory: .
        run: bash frontend/scripts/container-smoke.sh

      - name: Browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: frontend/test-results

  webkit-media:
    name: WebKit media (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and WebKit
        run: npm ci && npx playwright install webkit

      - name: Signed playback over HTTP and Range
        env:
          E2E_OSS_UPLOAD_ORIGIN: https://upload.example.invalid
          E2E_OSS_PLAYBACK_ORIGIN: https://media.example.invalid
          E2E_REAL_MEDIA: "1"
          API_PROXY_TARGET: http://127.0.0.1:4175
        run: |
          SMOKE_BACKEND_PORT=4175 SMOKE_CLIP_FILE="$PWD/e2e/fixtures/clip.mp4" node scripts/smoke-backend.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 6 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:4175/healthz
          npm run test:e2e -- --project webkit --grep 'OSS direct playback' --workers=1

      - name: Browser reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-media-results
          path: frontend/test-results

  production-compose:
    name: Production Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: TLS and isolated production services
        run: bash deploy/compose-smoke.sh
