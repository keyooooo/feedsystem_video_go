  client_body_timeout 60s;
  access_log /var/log/nginx/access.log feedsystem;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_origin http://backend:8080;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/security-headers.conf;

  # Revalidate the entry on every navigation after a deployment.
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Only Vite's fingerprinted assets receive long-lived caching.
  # Missing chunks must be a 404, never an HTML response masquerading as JS.
  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /api/notification/stream {
    proxy_pass $api_origin/notification/stream$is_args$args;
    include /etc/nginx/api-proxy.conf;
    proxy_buffering off;
    proxy_read_timeout 1h;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass $api_origin;
    include /etc/nginx/api-proxy.conf;
    proxy_read_timeout 180s;
    proxy_hide_header Cache-Control;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location /static/ {
    proxy_pass $api_origin;
    include /etc/nginx/api-proxy.conf;
    proxy_read_timeout 180s;
    proxy_buffering off;
  }
