server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 300m;
  client_body_timeout 60s;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/security-headers.conf;

  # Revalidate the entry on every navigation after a deployment.
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Only Vite's fingerprinted assets receive long-lived caching.
  # Missing chunks must be a 404, never an HTML response masquerading as JS.
  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_hide_header Cache-Control;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location /static/ {
    proxy_pass http://backend:8080/static/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_buffering off;
  }
}
